# READ-ONLY (2026-11-22): who used Website Admin > Store Requests to delete poll votes?
name: Diag who deleted store-poll votes

on:
  workflow_dispatch:

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Who deleted poll votes (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            echo "=== nginx: Store Requests page hits (any log readable) ==="
            ls -la /var/log/nginx/ 2>&1 | head -5
            zgrep -h "website-directory/requests" /var/log/nginx/*access* 2>/dev/null | grep -E "1[4-7]/Nov/2026" | awk '{print $4, $1, $6, $7, $9}' | sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.x.x/' | head -200
            cd /www/playlist.nivessa.com/app
            echo "=== laravel log mentions ==="
            grep -h -i "store-requests\|website-directory/requests" storage/logs/*.log 2>/dev/null | grep "2026-11-1[56]" | cut -c1-300 | head -40
            php artisan tinker --no-ansi <<'PHP'
            echo "allow_registration=" . json_encode(config('constants.allow_registration')) . " env=" . json_encode(env('ALLOW_REGISTRATION')) . "\n";
            echo "=== businesses ===\n";
            foreach (\DB::table('business')->orderBy('id')->get(['id', 'name', 'owner_id', 'created_at']) as $b) echo json_encode($b) . "\n";
            echo "=== users 60/87/88 ===\n";
            foreach ([60, 87, 88] as $id) { $m = \App\User::find($id); if ($m) echo json_encode(['id' => $id, 'username' => $m->username, 'business_id' => $m->business_id, 'roles' => $m->getRoleNames(), 'can_product_create' => $m->can('product.create'), 'can_sell_create' => $m->can('sell.create'), 'status' => $m->status, 'allow_login' => $m->allow_login ?? null]) . "\n"; }
            echo "=== user 60 edits on 11/15 ===\n";
            foreach (\DB::table('activity_log')->where('causer_id', 60)->where('description', 'edited')->orderBy('created_at')->get(['created_at', 'subject_type', 'subject_id', 'properties']) as $r) echo json_encode([$r->created_at, $r->subject_type, $r->subject_id, substr((string) $r->properties, 0, 250)]) . "\n";
            echo "=== activity by users 87/88 ===\n";
            foreach (\DB::table('activity_log')->whereIn('causer_id', [87, 88])->selectRaw('causer_id, date(created_at) d, description, count(*) n')->groupBy('causer_id', 'd', 'description')->get() as $r) echo json_encode($r) . "\n";
            PHP
            echo "=== done ==="
