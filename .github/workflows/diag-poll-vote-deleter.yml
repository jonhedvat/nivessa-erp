# READ-ONLY (2026-11-22): who used Website Admin > Store Requests to delete poll votes?
name: Diag who deleted store-poll votes

on:
  workflow_dispatch:

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Who deleted poll votes (read-only)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            echo "=== nginx: Store Requests page hits (any log readable) ==="
            ls -la /var/log/nginx/ 2>&1 | head -5
            zgrep -h "website-directory/requests" /var/log/nginx/*access* 2>/dev/null | grep -E "1[4-7]/Nov/2026" | awk '{print $4, $1, $6, $7, $9}' | sed -E 's/([0-9]+\.[0-9]+)\.[0-9]+\.[0-9]+/\1.x.x/' | head -200
            cd /www/playlist.nivessa.com/app
            echo "=== laravel log mentions ==="
            grep -h -i "store-requests\|website-directory/requests" storage/logs/*.log 2>/dev/null | grep "2026-11-1[56]" | cut -c1-300 | head -40
            php artisan tinker --no-ansi <<'PHP'
            $sus = \DB::table('users')->where(fn ($q) => $q->where('username', 'like', '%pHqghUme%')->orWhere('first_name', 'like', '%pHqghUme%')->orWhere('email', 'like', '%pHqghUme%'))->get();
            echo "=== suspicious users ===\n";
            foreach ($sus as $u) { $m = \App\User::find($u->id); echo json_encode(['id' => $u->id, 'username' => $u->username, 'email_domain' => substr(strrchr((string) $u->email, '@'), 1), 'user_type' => $u->user_type, 'status' => $u->status ?? null, 'business_id' => $u->business_id, 'created_at' => $u->created_at, 'updated_at' => $u->updated_at, 'deleted_at' => $u->deleted_at ?? null, 'roles' => $m ? $m->getRoleNames() : null, 'is_superadmin' => $m ? $m->can('superadmin') : null]) . "\n"; }
            $ids = $sus->pluck('id')->all();
            echo "=== who created it (activity_log subject=user) ===\n";
            foreach (\DB::table('activity_log as a')->leftJoin('users as u', 'u.id', '=', 'a.causer_id')->where('a.subject_type', 'App\\User')->whereIn('a.subject_id', $ids)->whereNotIn('a.description', ['pos_duty'])->orderBy('a.created_at')->limit(20)->get(['a.created_at', 'a.description', 'u.username']) as $r) echo json_encode($r) . "\n";
            echo "=== its activity per day/description ===\n";
            foreach (\DB::table('activity_log')->whereIn('causer_id', $ids)->selectRaw('date(created_at) d, description, count(*) n, min(created_at) first, max(created_at) last')->groupBy('d', 'description')->orderBy('d')->get() as $r) echo json_encode($r) . "\n";
            echo "=== ALL activity 2026-11-15 23:30 -> 2026-11-16 00:45 ===\n";
            foreach (\DB::table('activity_log as a')->leftJoin('users as u', 'u.id', '=', 'a.causer_id')->whereBetween('a.created_at', ['2026-11-15 23:30:00', '2026-11-16 00:45:00'])->orderBy('a.created_at')->limit(200)->get(['a.created_at', 'a.description', 'a.subject_type', 'u.username', 'a.properties']) as $r) echo json_encode([$r->created_at, $r->description, $r->subject_type, $r->username, substr((string) $r->properties, 0, 200)]) . "\n";
            echo "=== other recent oddly-named users (last 60d) ===\n";
            foreach (\DB::table('users')->where('created_at', '>=', now()->subDays(60))->orderBy('created_at')->get(['id', 'username', 'first_name', 'last_name', 'user_type', 'created_at']) as $u) echo json_encode($u) . "\n";
            echo "session driver=" . config('session.driver') . "\n";
            PHP
            echo "=== done ==="
