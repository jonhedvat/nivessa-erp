name: Diag duplicate POS sales stock audit

# Read-only: stock effect of each duplicate POS sale copy, whether the item
# was recounted/edited since, and which units look safe to put back. CSV in log.

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 20m
          script: |
            echo '' | base64 -d > /tmp/dup_stock_audit.php
            cd /www/playlist.nivessa.com/app && php -d memory_limit=1G artisan tinker /tmp/dup_stock_audit.php 2>&1
            rm -f /tmp/dup_stock_audit.php
