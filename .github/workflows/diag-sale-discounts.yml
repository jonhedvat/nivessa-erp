name: Diag sale discounts
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back (LA time)"
        required: false
        default: "3"
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0
      - name: Sales with a discount (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DAYS: ${{ inputs.days }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          envs: DAYS
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DAYS
            php artisan tinker --no-ansi <<'PHP'
            $days = max(1, (int) getenv('DAYS'));
            $from = now()->subDays($days)->toDateTimeString();
            $rows = \DB::table('transactions as t')->leftJoin('users as u','u.id','=','t.created_by')->leftJoin('business_locations as bl','bl.id','=','t.location_id')
              ->where('t.type','sell')->where('t.transaction_date','>=',$from)->where('t.discount_amount','>',0)
              ->orderByDesc('t.id')->limit(60)
              ->get(['t.id','t.invoice_no','t.transaction_date','t.discount_type','t.discount_amount','t.total_before_tax','t.final_total','t.rp_redeemed_amount','t.is_direct_sale','t.source','t.created_at','t.updated_at','u.username','bl.name as loc','t.additional_notes','t.staff_note']);
            $all = \DB::table('transactions')->where('type','sell')->where('transaction_date','>=',$from)->count();
            echo "sells since $from: $all, with discount: ".\DB::table('transactions')->where('type','sell')->where('transaction_date','>=',$from)->where('discount_amount','>',0)->count()."\n";
            echo "by amount/type:\n";
            foreach (\DB::table('transactions')->where('type','sell')->where('transaction_date','>=',$from)->where('discount_amount','>',0)->selectRaw('discount_type, discount_amount, count(*) c, min(transaction_date) first, max(transaction_date) last')->groupBy('discount_type','discount_amount')->orderByDesc('c')->get() as $g) echo "  {$g->discount_type} {$g->discount_amount} x{$g->c}  {$g->first} .. {$g->last}\n";
            foreach (\DB::table('transactions')->where('type','sell')->where('transaction_date','>=',$from)->selectRaw('date(transaction_date) d, sum(discount_amount>0) disc, count(*) c')->groupBy('d')->orderBy('d')->get() as $g) echo "  day {$g->d}: {$g->disc}/{$g->c} discounted\n";
            foreach ($rows as $r) {
              $lines = \DB::table('transaction_sell_lines as l')->leftJoin('products as p','p.id','=','l.product_id')->where('l.transaction_id',$r->id)->get(['p.name','l.quantity','l.unit_price_before_discount','l.unit_price_inc_tax','l.line_discount_type','l.line_discount_amount']);
              $pay = \DB::table('transaction_payments')->where('transaction_id',$r->id)->get(['method','amount','is_return']);
              echo "\n#{$r->id} {$r->invoice_no} {$r->transaction_date} {$r->loc} by {$r->username} disc={$r->discount_type}:{$r->discount_amount} before_tax={$r->total_before_tax} final={$r->final_total} rp={$r->rp_redeemed_amount} src={$r->source} upd={$r->updated_at}\n";
              if ($r->additional_notes || $r->staff_note) echo "   notes: ".trim($r->additional_notes.' | '.$r->staff_note)."\n";
              foreach ($lines as $l) echo "   - ".mb_substr((string)$l->name,0,50)." q{$l->quantity} pre={$l->unit_price_before_discount} inc={$l->unit_price_inc_tax} ld={$l->line_discount_type}:{$l->line_discount_amount}\n";
              foreach ($pay as $p) echo "   \$ {$p->method} {$p->amount}".($p->is_return?' (change)':'')."\n";
            }
            PHP
