# READ-ONLY: search ERP products by words in name/artist; prints category,
# price, per-store stock and units sold. No writes.
name: Diag product search (read-only)

on:
  workflow_dispatch:
    inputs:
      term:
        description: "Words to match in product name/artist (all must match)"
        required: true

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Search
        uses: appleboy/ssh-action@v1.2.0
        env:
          TERM_Q: ${{ github.event.inputs.term }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          envs: TERM_Q
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_product_search.php
            php /tmp/diag_product_search.php
            rm -f /tmp/diag_product_search.php
