# One-off, read-only: products added with the same name within 2 minutes of
# each other (likely accidental double adds). SELECTs + temp tables only.

name: Diag duplicate product adds (read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Look-back window in days'
        default: '180'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_dup_adds.php
            DAYS='${{ github.event.inputs.days }}' php /tmp/diag_dup_adds.php
            rm -f /tmp/diag_dup_adds.php
