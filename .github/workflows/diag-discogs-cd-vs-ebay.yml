# One-off, read-only: lists our Discogs (nivessa) CD listings and looks each up on eBay
# (Browse API, Buy It Now asking prices, CD category) to find CDs priced far under eBay.
# Reads Discogs + eBay APIs only. Writes nothing.

name: Diag Discogs CDs vs eBay (read-only)

on:
  workflow_dispatch:
    inputs:
      max:
        description: 'Max CDs to look up on eBay (eBay Browse quota ~5000/day)'
        default: '4000'
      offset:
        description: 'Skip this many CDs (sorted by our price, high to low)'
        default: '0'

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 110m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_cdebay.php
            MAX='${{ inputs.max }}' OFF='${{ inputs.offset }}' php /tmp/diag_cdebay.php
            rm -f /tmp/diag_cdebay.php
