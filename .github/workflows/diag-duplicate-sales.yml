name: Diag duplicate sales check

# Read-only: given sale transaction ids, show their line items, neighbouring
# transactions, all-time stock picture for those products, the cash register
# they hit (system cash vs closing count) and activity log — to tell whether
# they are one sale saved several times.

on:
  workflow_dispatch:
    inputs:
      tx_ids:
        description: Comma-separated transaction ids
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          TX_IDS: ${{ inputs.tx_ids }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: TX_IDS
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/dup_sales.php
            cd /www/playlist.nivessa.com/app && TX_IDS="$TX_IDS" php artisan tinker /tmp/dup_sales.php 2>&1
            rm -f /tmp/dup_sales.php
