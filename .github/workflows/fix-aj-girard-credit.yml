name: Fix AJ Girard credit (one-off)

# One-off: contact 76's 4/16 sale was saved 7 times, taking $2 credit and
# 49 points each time. Sets credit to $0 and points to 49, zeroes rp_earned on
# the 6 duplicate sales, logs an audit line. Dry run unless commit=true.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Write changes (false = dry run)
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT: ${{ inputs.commit && '1' || '0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: COMMIT
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/fix_aj.php
            cd /www/playlist.nivessa.com/app && COMMIT="$COMMIT" php artisan tinker /tmp/fix_aj.php 2>&1
            rm -f /tmp/fix_aj.php
