# One-off, read-only: avg days to sell (purchase date -> sale date via
# transaction_sell_lines_purchase_lines) for a list of sealed vinyl product ids. SELECTs only.

name: Diag sealed vinyl days to sell (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_sealed_vinyl_days.php
            php -l /tmp/diag_sealed_vinyl_days.php
            php /tmp/diag_sealed_vinyl_days.php
            rm -f /tmp/diag_sealed_vinyl_days.php
