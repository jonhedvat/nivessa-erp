# Read-only: label preview errors + compile check of preview_2 view.
# (was: tail the Laravel log for any warnings/errors logged during the
# e2e browser test window, to confirm nothing silently failed behind a
# try/catch even though the UI looked clean.

name: Diag label preview

on:
  workflow_dispatch: {}

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1; then
              exit 0
            fi
            sleep 3
          done
          exit 0

      - name: Tail recent log for errors/warnings
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            echo "=== label errors in today's log ==="
            for f in storage/logs/laravel-2026-11-23.log storage/logs/laravel-$(date +%Y-%m-%d).log; do
              [ -f "$f" ] && grep -aE "emergency|ERROR" "$f" | grep -aiE "label|preview" | tail -n 15 | cut -c1-700
            done
            echo "=== compile + lint preview_2 ==="
            php artisan tinker --no-ansi <<'PHP'
            file_put_contents('/tmp/nv_preview_2.php', Blade::compileString(file_get_contents(resource_path('views/labels/partials/preview_2.blade.php'))));
            echo "compiled\n";
            PHP
            php -l /tmp/nv_preview_2.php
            echo "=== category / subcategory of products added in last 4 days ==="
            php artisan tinker --no-ansi <<'PHP'
            foreach (DB::select("select c.name cat, s.name sub, count(*) n from products p left join categories c on c.id=p.category_id left join categories s on s.id=p.sub_category_id where p.created_at >= now() - interval 4 day group by c.name, s.name order by n desc limit 40") as $r) { echo str_pad($r->n,6).' | '.$r->cat.' | '.($r->sub ?? '(none)')."\n"; }
            PHP
            echo "=== recent products with no subcategory: who/when/how ==="
            php artisan tinker --no-ansi <<'PHP'
            foreach (DB::select("select p.id, p.name, p.created_at, c.name cat, concat(u.first_name,' ',coalesce(u.last_name,'')) who, p.sku, (select count(*) from purchase_lines pl join variations v on v.id=pl.variation_id where v.product_id=p.id) pls from products p left join categories c on c.id=p.category_id left join users u on u.id=p.created_by where p.created_at >= now() - interval 4 day and p.sub_category_id is null order by p.created_at desc limit 50") as $r) { echo "NOSUB | {$r->id} | {$r->created_at} | {$r->who} | ".($r->cat ?? '(no cat)')." | {$r->name} | pl={$r->pls}\n"; }
            PHP
            echo "=== which purchase/import created them ==="
            php artisan tinker --no-ansi <<'PHP'
            foreach (DB::select("select t.id, t.type, t.ref_no, t.status, left(coalesce(t.additional_notes,''),80) notes, t.created_at, count(distinct p.id) n, sum(p.category_id is null) nocat, sum(p.sub_category_id is null) nosub from products p join variations v on v.product_id=p.id join purchase_lines pl on pl.variation_id=v.id join transactions t on t.id=pl.transaction_id where p.created_at >= now() - interval 4 day and p.sub_category_id is null group by t.id order by t.created_at") as $r) { echo "SRC | t{$r->id} | {$r->type} | {$r->ref_no} | {$r->created_at} | n={$r->n} nocat={$r->nocat} | {$r->notes}\n"; }
            PHP
