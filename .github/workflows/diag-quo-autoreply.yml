# Read-only: shows the text of Quo's missed-call auto-reply as logged in the Hub, and missed-call volume. SELECTs only.
name: Diag Quo missed-call auto-reply (read-only)
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script: |
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_qar.php
            php /tmp/diag_qar.php
            rm -f /tmp/diag_qar.php
