# Moves the clear-cut misfiles from the 11/19 category audit (cards in the wrong sport,
# sealed filed as used, artists in the wrong genre). DRY RUN by default; tick commit to write.
# Undo log: storage/app/category-fix-undo-*.json

name: Fix category mismatches (11/19 audit)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually move? (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/cat_fix.php
            php /tmp/cat_fix.php ${{ github.event.inputs.commit == 'true' && '--commit' || '' }}
            rm -f /tmp/cat_fix.php
