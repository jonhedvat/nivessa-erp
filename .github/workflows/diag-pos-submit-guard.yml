name: Diag POS submit guard

# Read-only: is the POS one-cart-one-sale guard (pos_submit_tokens) claiming
# tokens on real sales since deploy?

on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/pos_guard.php
            cd /www/playlist.nivessa.com/app && php artisan tinker /tmp/pos_guard.php 2>&1
            rm -f /tmp/pos_guard.php
