# READ-ONLY: where did RSD BF 2026 copies go per store (purchases, sales, transfers,
# adjustments, current stock) for titles where Pico is short vs what was ordered.
# No writes. Runs on push to this diag branch only.
name: Nivessa · diag RSD Pico ledger (read-only)
on:
  push:
    branches: [diag-rsd-pico-ledger]
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          for a in 1 2 3; do ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>&1 && exit 0; sleep 3; done; exit 0
      - name: Run over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_rsd_ledger.php
            php /tmp/diag_rsd_ledger.php; rm -f /tmp/diag_rsd_ledger.php
