# One-off, read-only: stale (6mo+ unsold) used/sealed music at a store, top
# artists by stale units, and a live Discogs market check (lowest price, copies
# for sale, want/have) on the highest-priced stale releases -> which to sell
# online. SELECTs + temp tables + Discogs GETs only.

name: Diag stale stock online candidates (read-only)

on:
  workflow_dispatch:
    inputs:
      location:
        description: Location id (1 = Pico, 2 = Hollywood)
        default: '2'
      max_releases:
        description: How many releases to check on Discogs (~2.5s each)
        default: '220'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 40m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_online.php
            php -l /tmp/diag_online.php
            LOC='${{ github.event.inputs.location }}' MAXR='${{ github.event.inputs.max_releases }}' php /tmp/diag_online.php
            rm -f /tmp/diag_online.php
