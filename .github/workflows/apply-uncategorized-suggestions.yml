# Applies the 11/19 suggestion list (v4) to in-stock products that still have no category;
# deactivates the 2 test items. Skips anything categorized since. DRY RUN by default.
# Undo log: storage/app/uncategorized-apply-undo-*.json

name: Categorize uncategorized products (11/19 list)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually move? (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/uncat_apply.php
            php /tmp/uncat_apply.php ${{ github.event.inputs.commit == 'true' && '--commit' || '' }}
            rm -f /tmp/uncat_apply.php
