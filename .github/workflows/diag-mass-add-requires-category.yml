# Calls Mass Add save with rows that must fail validation (no store location, blank /
# deleted category) and prints the errors. Nothing is created.

name: Diag Mass Add requires category (no writes)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_mass_cat.php
            php /tmp/diag_mass_cat.php 2>&1 || true
            rm -f /tmp/diag_mass_cat.php
