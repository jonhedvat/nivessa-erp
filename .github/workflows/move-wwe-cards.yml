# Moves wrestling cards in Trading Cards into the WWE Cards subcategory.
# DRY RUN by default; tick commit to write. Writes an undo log to storage/app/wwe-move-undo-*.json.

name: Move wrestling cards to WWE Cards

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually move? (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/wwe_move.php
            php /tmp/wwe_move.php ${{ github.event.inputs.commit == 'true' && '--commit' || '' }}
            rm -f /tmp/wwe_move.php
