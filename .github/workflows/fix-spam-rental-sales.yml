# Removes ERP "Space Rental" sales that came from the 11/15/26 spam venue bookings
# (website cancelled them as scanner junk; forged "paid" status, no Stripe/PayPal).
# DRY RUN by default. Commit writes an undo snapshot to storage/app/spam-rental-undo-*.json.
name: Remove spam space-rental sales (11/15)
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually delete? (leave unchecked for a dry run)'
        type: boolean
        default: false
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Run
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        with:
          envs: COMMIT
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/fix_spam_rental.php
            COMMIT="$COMMIT" php /tmp/fix_spam_rental.php
            rm -f /tmp/fix_spam_rental.php
