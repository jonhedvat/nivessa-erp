# READ-ONLY (2026-11-18): what was listed (products created) on a given day,
# grouped by genre (sub_category) and category, with price + lister.
# Optional search finds a specific item (e.g. "judee sill") across all dates.
name: Diag day listings by genre

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD (app timezone)"
        required: true
      search:
        description: "Optional product name fragment to locate"
        required: false
        default: ""

concurrency:
  group: production-diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0

      - name: Day listings (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_DATE: ${{ github.event.inputs.date }}
          DIAG_SEARCH: ${{ github.event.inputs.search }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          envs: DIAG_DATE,DIAG_SEARCH
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export DIAG_DATE DIAG_SEARCH
            php artisan tinker --no-ansi <<'PHP'
            $day = getenv('DIAG_DATE'); $s = trim((string) getenv('DIAG_SEARCH'));
            echo 'TZ app=' . config('app.timezone') . "\n";
            echo '[LOC] ' . json_encode(\DB::table('business_locations')->get(['id','name'])) . "\n";
            $ids = \DB::table('products')->whereBetween('created_at', ["$day 00:00:00", "$day 23:59:59"])->pluck('id')->all();
            if ($s !== '') { $ids = array_merge($ids, \DB::table('products')->where('name','like',"%$s%")->pluck('id')->all()); }
            $cats = \DB::table('categories')->pluck('name','id');
            $users = \DB::table('users')->get(['id','first_name','last_name','username'])->keyBy('id');
            $price = \DB::table('variations')->whereIn('product_id',$ids)->groupBy('product_id')->select('product_id', \DB::raw('max(sell_price_inc_tax) pr'))->pluck('pr','product_id');
            $vld = \DB::table('variation_location_details')->whereIn('product_id',$ids)->select('product_id','location_id', \DB::raw('sum(qty_available) q'))->groupBy('product_id','location_id')->get()->groupBy('product_id');
            $pl = \DB::table('purchase_lines as l')->join('transactions as t','t.id','=','l.transaction_id')->whereIn('l.product_id',$ids)->select('l.product_id','t.location_id','t.type')->get()->groupBy('product_id');
            if ($s !== '') {
              $q = \DB::table('transaction_sell_lines as l')->join('transactions as t','t.id','=','l.transaction_id')->leftJoin('products as p','p.id','=','l.product_id')
                ->where('t.type','sell')->where(function ($w) use ($s) { $w->where('p.name','like',"%$s%")->orWhere('p.artist','like',"%$s%"); if (\Schema::hasColumn('transaction_sell_lines','legacy_artist')) { $w->orWhere('l.legacy_artist','like',"%$s%")->orWhere('l.legacy_title','like',"%$s%"); } })
                ->select('t.id as tx','t.invoice_no','t.transaction_date','t.status','t.payment_status','t.location_id','l.product_id','p.name','l.quantity','l.quantity_returned','l.unit_price_inc_tax','t.created_by');
              foreach ($q->orderBy('t.transaction_date')->get() as $r) echo '[SALE] ' . json_encode($r) . "\n";
            }
            foreach (\DB::table('products')->whereIn('id',$ids)->orderBy('created_at')->get() as $p) {
              $u = $users[$p->created_by] ?? null;
              echo '[P] ' . json_encode(['id'=>$p->id,'name'=>$p->name,'artist'=>$p->artist ?? null,'at'=>$p->created_at,'cat'=>$cats[$p->category_id] ?? null,'genre'=>$cats[$p->sub_category_id] ?? null,'price'=>$price[$p->id] ?? null,'by'=>$p->created_by,'who'=>$u ? trim($u->first_name.' '.$u->last_name).' ('.$u->username.')' : null,'vld'=>$vld[$p->id] ?? [],'purch'=>$pl[$p->id] ?? []]) . "\n";
            }
            PHP
