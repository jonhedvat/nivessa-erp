# One-off, read-only: used vinyl that sold at Hollywood within 30 days of
# arriving (last 365d) where no sealed vinyl copy of the same title was at
# Hollywood (stock, stock-in or sale) in the last year. SELECTs only.

name: Diag HW fast used vinyl with no sealed (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_hw_fast_used.php
            php -l /tmp/diag_hw_fast_used.php
            php /tmp/diag_hw_fast_used.php
            rm -f /tmp/diag_hw_fast_used.php
