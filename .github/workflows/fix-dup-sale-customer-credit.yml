name: Fix duplicate-sale customer credit (one-off)

# One-off: 8 customers whose POS sale was saved 2+ times (double Cash/Card
# click). Gives back the store credit the duplicates spent, removes their
# points, zeroes rp_earned on the duplicates. Dry run unless commit=true.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Write changes (false = dry run)
        type: boolean
        default: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT: ${{ inputs.commit && '1' || '0' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: COMMIT
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/fix_dup_credit.php
            cd /www/playlist.nivessa.com/app && COMMIT="$COMMIT" php artisan tinker /tmp/fix_dup_credit.php 2>&1
            rm -f /tmp/fix_dup_credit.php
