# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach (\DB::table('time_clock_punches as p')->leftJoin('users as u','u.id','=','p.user_id')->where('p.clock_in_at','>=','2026-11-13 00:00:00')->where('p.clock_in_at','<','2026-11-14 03:00:00')->orderBy('p.clock_in_at')->get(['u.first_name','p.location_id','p.clock_in_at','p.clock_out_at','p.voided_at']) as $r) echo 'PUNCH '.json_encode($r)."\n";
            PHP
            echo "=== done ==="
