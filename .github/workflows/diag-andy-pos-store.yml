# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            F=$(sudo -n true 2>/dev/null && echo sudo -n)
            for f in /var/log/nginx/access.log.3.gz /var/log/nginx/access.log.4.gz /var/log/nginx/access.log.2.gz; do echo "FILE $f"; $F zgrep -ah "99.51.151.186" $f | grep -E "13/Nov/2026" | grep "POST" | cut -c1-220 | head -40; done
            $F zgrep -ah "13/Nov/2026:2" /var/log/nginx/access.log.3.gz | grep POST | head -3 | cut -c1-250
            php artisan tinker --no-ansi <<'PHP'
            foreach (\DB::table('transactions')->where('created_by',64)->where('type','sell')->whereBetween('transaction_date',['2026-11-13 11:00:00','2026-11-13 15:10:00'])->orderBy('created_at')->get(['id','invoice_no','created_at','final_total']) as $r) echo 'TX '.json_encode($r)."\n";
            PHP
            echo "=== done ==="
