# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $u=\App\User::find(64); \Auth::setUser($u); $ss=app('session')->driver(); $ss->put('user.business_id',1); $ss->put('user.id',64);
            $c=app(\App\Http\Controllers\SellPosController::class); $m=new \ReflectionMethod($c,'crossStoreRingMessage'); $m->setAccessible(true);
            foreach ([['99.51.151.186',2],['99.51.151.186',1],['97.167.218.97',2],['97.167.218.97',1],['8.8.8.8',2]] as [$ip,$loc]) { $r=\Illuminate\Http\Request::create('/pos','POST',['location_id'=>$loc],[],[],['REMOTE_ADDR'=>$ip]); $r->setLaravelSession($ss); echo "TEST $ip sale_loc=$loc => ".json_encode($m->invoke($c,$r))."\n"; }
            echo 'BLADE '.(strpos(file_get_contents('resources/views/sale_pos/create.blade.php'),'cross_store_msg')!==false?'deployed':'missing')."\n";
            PHP
            echo "=== done ==="
