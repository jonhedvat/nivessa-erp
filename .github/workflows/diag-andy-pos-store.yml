# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy POS store 11-13 perms (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $locs = \DB::table('business_locations')->where('business_id',1)->orderBy('id')->pluck('id')->all();
            foreach (\DB::table('cash_registers as r')->join('users as u','u.id','=','r.user_id')->where('r.created_at','>=','2026-09-01')->groupBy('r.user_id','u.first_name','u.last_name')->selectRaw("r.user_id, u.first_name, u.last_name, SUM(r.location_id=2) hw, SUM(r.location_id=1) pico, MIN(r.created_at) first, MAX(r.created_at) last")->get() as $r) { $usr=\App\User::find($r->user_id); $old=null; if ($usr->can('access_all_locations')) $old=$locs[0]; else foreach ($locs as $l) if ($usr->can('location.'.$l)) { $old=$l; break; } if (!$old) $old=$locs[0]; echo json_encode(['who'=>$r->first_name.' '.$r->last_name,'hw_shifts'=>$r->hw,'pico_shifts'=>$r->pico,'old_tally_store'=>$old,'all'=>$usr->can('access_all_locations'),'last'=>$r->last])."\n"; }
            PHP
            echo "=== done ==="
