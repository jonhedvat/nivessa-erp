# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach (\DB::table('transaction_sell_lines as l')->join('products as p','p.id','=','l.product_id')->leftJoin('variations as v','v.id','=','l.variation_id')->whereIn('l.transaction_id',[187046,187053,187055,187091,187101])->get(['l.transaction_id','l.variation_id','p.name','p.artist','v.sub_sku','p.enable_stock','l.unit_price_inc_tax','p.created_at']) as $r) { $vl=\DB::table('variation_location_details')->where('variation_id',$r->variation_id)->pluck('qty_available','location_id'); $hist=\DB::table('transaction_sell_lines as l2')->join('transactions as t','t.id','=','l2.transaction_id')->where('l2.variation_id',$r->variation_id)->where('t.type','sell')->count(); $pur=\DB::table('purchase_lines as pl')->join('transactions as t','t.id','=','pl.transaction_id')->where('pl.variation_id',$r->variation_id)->selectRaw('t.location_id, t.type, sum(pl.quantity) q')->groupBy('t.location_id','t.type')->get(); echo 'ITEM '.json_encode([$r->transaction_id,$r->variation_id,$r->artist,$r->name,$r->sub_sku,'stock'=>$r->enable_stock,'price'=>round($r->unit_price_inc_tax,2),'vld'=>$vl,'sells'=>$hist,'in'=>$pur])."\n"; }
            PHP
            echo "=== done ==="
