# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach (\DB::table('sling_shifts')->whereBetween('dtstart',['2026-11-12 00:00:00','2026-11-14 06:00:00'])->orderBy('location_name')->orderBy('dtstart')->get(['user_name','event_type','location_name','position_name','dtstart','dtend','published','last_synced_at']) as $r) echo 'SLING '.json_encode($r)."\n";
            echo 'SLING range '.\DB::table('sling_shifts')->min('dtstart').' .. '.\DB::table('sling_shifts')->max('dtstart').' last_sync '.\DB::table('sling_shifts')->max('last_synced_at')."\n";
            PHP
            echo "=== done ==="
