# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy POS store 11-13 perms (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach ([[64,'2026-11-13 00:00:00'],[83,'2026-11-13 00:00:00'],[77,'2026-11-13 00:00:00']] as [$me_id,$today_start]) { echo json_encode([$me_id, \DB::table('cash_registers')->where('user_id',$me_id)->where(function($q) use ($today_start){$q->where('status','open')->orWhere('created_at','>=',$today_start);})->orderByRaw("status = 'open' DESC")->orderByDesc('created_at')->value('location_id')])."\n"; }
            echo 'HOME_OK=' . (strpos(file_get_contents('app/Http/Controllers/HomeController.php'),'Andy (both stores)')!==false ? 'deployed' : 'missing') . "\n";
            PHP
            echo "=== done ==="
