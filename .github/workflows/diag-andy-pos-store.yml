# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            foreach (['2RDD8N46NED8W','NXYVAWQ88MCTG','NQAG53FJACHE2'] as $o) { $r=\DB::table('clover_payments')->where('clover_order_id',$o)->first(); echo "RAW $o loc={$r->location_id} ".substr(preg_replace('/"(cardNumber|token|authCode|cardholderName|first6)":"[^"]*"/','"$1":"x"',$r->raw_payload),0,2500)."\n"; }
            echo "DEVICE 68f24928 by day/loc\n";
            foreach (\DB::table('clover_payments')->where('raw_payload','like','%68f24928-57fe%')->where('paid_on','>=','2026-10-01')->groupBy('paid_on','location_id')->selectRaw('paid_on,location_id,count(*) n,sum(amount_cents)/100 t, min(paid_at) a, max(paid_at) z')->orderBy('paid_on')->get() as $x) echo json_encode($x)."\n";
            PHP
            echo "=== done ==="
