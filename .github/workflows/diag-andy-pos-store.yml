# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy Clover 11-13 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $b=\App\Business::first(); \Auth::setUser(\App\User::find($b->owner_id)); $ss=app('session')->driver(); $ss->put('user.business_id',$b->id); $ss->put('user.id',$b->owner_id);
            $req=\Illuminate\Http\Request::create('/pos/recent-feed','GET',['date'=>'2026-11-13']); $req->setLaravelSession($ss);
            $d=app(\App\Http\Controllers\SellPosController::class)->recentSalesFeed($req)->getData();
            $cf=$d['cashier_for_orphan']??[]; $cn=$d['cashierNameById']??[];
            echo "ORPHANS (Clover, no ERP sale)\n";
            foreach (($d['unclaimed_clover_payments']??collect()) as $o) { $o=json_decode(json_encode($o),true); $p=json_decode($o['raw_payload']??'',true)?:[]; $id=$o['id']??null; echo json_encode(['loc'=>$o['location_id']??null,'amt'=>($o['amount_cents']??0)/100,'paid_at'=>$o['paid_at']??null,'paid_on'=>$o['paid_on']??null,'cashier'=>$cn[$cf[$id]??0]??($cf[$id]??null),'dev'=>$p['device']['id']??null,'order'=>$o['clover_order_id']??null,'emp'=>$p['employee']['id']??null])."\n"; }
            echo "ANDY ERP SALES with no Clover match\n";
            $by=$d['clover_by_transaction']??[]; echo '';
            foreach ($d['sales'] as $s) { $s=json_decode(json_encode($s),true); if (($s['created_by']??0)!=64) continue; if (!empty($by[$s['id']])) continue; echo json_encode([$s['id'],$s['transaction_date'],$s['final_total'],$s['location_id']])."\n"; }
            echo "TZ ".config('app.timezone')." sample paid_at ".\DB::table('clover_payments')->where('paid_on','2026-11-13')->min('paid_at')." .. ".\DB::table('clover_payments')->where('paid_on','2026-11-13')->max('paid_at')." n=".\DB::table('clover_payments')->where('paid_on','2026-11-13')->count()."\n";
            PHP
            echo "=== done ==="
