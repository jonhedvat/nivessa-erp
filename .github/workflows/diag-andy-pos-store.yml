# READ-ONLY (2026-11-16): Andy says his sales today did not tally on the POS page,
# maybe "seeing me as Pico but ringing Hollywood". Sales, registers, locations. No writes.
name: Diag Andy POS store 11-13 perms (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: false
          command_timeout: 300s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php artisan tinker --no-ansi <<'PHP'
            $day = '2026-11-13';
            foreach (\DB::table('users')->whereIn('first_name',['Andy','Michael','Jai','Luis','Zakary','Quenton','Alec','Manolo','Jacob'])->where('business_id',1)->get(['id','first_name']) as $u) { $usr = \App\User::find($u->id); echo json_encode([$u->id,$u->first_name,'roles'=>$usr->getRoleNames(),'all'=>$usr->can('access_all_locations'),'L1pico'=>$usr->can('location.1'),'L2hw'=>$usr->can('location.2'),'sell.view'=>$usr->can('sell.view'),'own'=>$usr->can('view_own_sell_only')])."\n"; }
            PHP
            echo "=== done ==="
