name: Diag duplicate POS sales audit

# Read-only: all-time scan for POS sales saved 2+ times (same cashier,
# location, customer, total and identical line items within N minutes).
# Totals extra revenue, points, store credit and units by month.

on:
  workflow_dispatch:
    inputs:
      window_min:
        description: Max minutes between copies
        default: '10'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          WINDOW_MIN: ${{ inputs.window_min }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: WINDOW_MIN
          command_timeout: 20m
          script: |
            echo '' | base64 -d > /tmp/dup_audit.php
            cd /www/playlist.nivessa.com/app && WINDOW_MIN="$WINDOW_MIN" php -d memory_limit=1G artisan tinker /tmp/dup_audit.php 2>&1
            rm -f /tmp/dup_audit.php
