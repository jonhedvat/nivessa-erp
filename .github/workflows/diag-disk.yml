name: Diag disk usage

# Read-only: where is disk going on the prod VPS (Hostinger disk-full alerts).
on:
  workflow_dispatch:
    inputs:
      run_backup:
        description: 'Also run db:backup-daily now (tests the backup job)'
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3 4 5; do ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; grep -q . ~/.ssh/known_hosts && break; sleep 5; done
      - name: Disk usage
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 20m
          script_stop: false
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            php -l app/Services/DatabaseBackupService.php; php -l app/Console/Commands/DailyDatabaseBackup.php
            if [ "${{ inputs.run_backup }}" = "true" ]; then
              echo "== running db:backup-daily"; time php artisan db:backup-daily 2>&1 | tail -5
            fi
            df -h /
            echo "== backup dirs"; du -sh storage/app/database_backups/* 2>/dev/null | sort -V | head -25; ls -lh storage/app/database_backups/1 2>/dev/null
            echo "== storage/app depth 3"; du -xh --max-depth=3 storage/app 2>/dev/null | sort -rh | head -30
            echo "== storage/logs"; ls -lhS storage/logs | head -10
            for d in $(du -x --max-depth=2 storage/app 2>/dev/null | sort -rn | sed -n '2,4p' | cut -f2); do
              echo "== $d: file count $(find $d -type f | wc -l)"
              echo "-- by month (mtime)"; find $d -type f -printf '%TY-%Tm %s\n' | awk '{a[$1]+=$2;n[$1]++} END{for(k in a) printf "%s %.1fG %d files\n",k,a[k]/1073741824,n[k]}' | sort | tail -24
              echo "-- by extension"; find $d -type f -printf '%f %s\n' | awk '{n=split($1,x,"."); e=(n>1?x[n]:"none"); a[e]+=$2; c[e]++} END{for(k in a) printf "%.1fG %d .%s\n",a[k]/1073741824,c[k],k}' | sort -rn | head -8
              echo "-- sample newest"; ls -lt $d | head -6
              echo "-- sample oldest"; ls -ltr $d | head -4
            done
            cat > /tmp/diskdiag.php <<'PHPEOF'
            <?php
            require '/www/playlist.nivessa.com/app/vendor/autoload.php';
            $app = require '/www/playlist.nivessa.com/app/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            use Illuminate\Support\Facades\DB;
            foreach (DB::select('SELECT table_schema s, ROUND(SUM(data_length+index_length+data_free)/1073741824,2) gb FROM information_schema.tables GROUP BY table_schema ORDER BY gb DESC') as $r) echo "DB {$r->s} {$r->gb}G\n";
            foreach (DB::select('SELECT table_schema s, table_name t, ROUND((data_length+index_length)/1073741824,2) gb, ROUND(data_free/1073741824,2) fr, table_rows r FROM information_schema.tables ORDER BY data_length+index_length+data_free DESC LIMIT 15') as $r) echo "TBL {$r->s}.{$r->t} {$r->gb}G free={$r->fr}G rows={$r->r}\n";
            try { $b = DB::select('SHOW BINARY LOGS'); $t=0; foreach ($b as $x) $t += $x->File_size; echo 'BINLOGS n='.count($b).' total='.round($t/1073741824,2)."G\n"; } catch (\Throwable $e) { echo 'BINLOGS err: '.substr($e->getMessage(),0,150)."\n"; }
            foreach (['log_bin','binlog_expire_logs_seconds','general_log','general_log_file','slow_query_log','datadir'] as $v) { try { $x = DB::select("SELECT @@$v v"); echo "VAR $v=".$x[0]->v."\n"; } catch (\Throwable $e) { echo "VAR $v n/a\n"; } }
            PHPEOF
            sed -i 's/^            //' /tmp/diskdiag.php
            echo "== mysql"; php /tmp/diskdiag.php 2>&1 | head -40; rm -f /tmp/diskdiag.php
