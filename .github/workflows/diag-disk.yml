name: Diag disk usage

# Read-only: where is disk going on the prod VPS (Hostinger disk-full alerts).
on:
  workflow_dispatch:
    inputs:
      delete_dup_backups:
        description: 'DELETE duplicate DB backups in business folders other than 1'
        required: false
        default: false
        type: boolean
      drive_check:
        description: 'Diagnose the Google Drive backup upload (read-only + tiny test POST)'
        required: false
        default: false
        type: boolean
      run_backup:
        description: 'Also run db:backup-daily now (tests the backup job)'
        required: false
        default: false
        type: boolean

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          for i in 1 2 3 4 5; do ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true; grep -q . ~/.ssh/known_hosts && break; sleep 5; done
      - name: Disk usage
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 20m
          script_stop: false
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            if [ "${{ inputs.drive_check }}" = "true" ]; then
              echo "== drive config (secrets masked)"
              grep -E '^DB_BACKUP_GOOGLE_DRIVE_' .env | sed -E 's/(TOKEN=).+/\1<set>/; s#(WEBHOOK_URL=https?://[^/]+/).*#\1...#'
              U=$(grep -E '^DB_BACKUP_GOOGLE_DRIVE_WEBHOOK_URL=' .env | cut -d= -f2- | tr -d '"'"'"' ')
              echo "url path shape: $(echo "$U" | sed -E 's#https?://[^/]+##; s#/[A-Za-z0-9_-]{30,}#/<id>#g')"
              echo "== upload history in laravel logs"
              grep -h -o 'Database backup drive upload [a-z]*.\{0,300\}' storage/logs/laravel-*.log 2>/dev/null | sed -E 's/"token":"[^"]*"//' | cut -c1-260 | sort | uniq -c | sort -rn | head -15
              for f in $(ls storage/logs/laravel-*.log | tail -40); do s=$(grep -c 'drive upload succeeded' $f); x=$(grep -c 'drive upload failed' $f); [ "$s$x" != "00" ] && echo "$(basename $f) ok=$s fail=$x"; done
              echo "== test POSTs via PHP (tiny + 5MB + 40MB)"
              cat > /tmp/drivetest.php <<'PHPEOF'
              <?php
              require '/www/playlist.nivessa.com/app/vendor/autoload.php';
              $app = require '/www/playlist.nivessa.com/app/bootstrap/app.php';
              $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              $c = config('nivessa.backup_google_drive');
              foreach ([1, 5*1024*1024, 40*1024*1024] as $size) {
                $f = tempnam('/tmp', 'dt'); file_put_contents($f, random_bytes($size));
                $ch = curl_init();
                curl_setopt_array($ch, [CURLOPT_URL => trim($c['webhook_url']), CURLOPT_POST => true, CURLOPT_RETURNTRANSFER => true, CURLOPT_FOLLOWLOCATION => false, CURLOPT_TIMEOUT => 200,
                  CURLOPT_POSTFIELDS => ['business_id' => '1', 'filename' => "connectivity_test_{$size}.sql.gz", 'token' => $c['token'], 'folder_id' => $c['folder_id'], 'file' => new \CURLFile($f, 'application/gzip', "connectivity_test_{$size}.sql.gz")]]);
                $t = microtime(true); $body = curl_exec($ch); $code = curl_getinfo($ch, CURLINFO_HTTP_CODE); $err = curl_error($ch); curl_close($ch); @unlink($f);
                $body = trim(preg_replace('/\s+/', ' ', strip_tags((string) $body)));
                $body = preg_replace('#https?://[^\s"]+#', '<url>', $body);
                printf("size=%d http=%d %.1fs err=%s body=%s\n", $size, $code, microtime(true)-$t, $err, substr($body, 0, 400));
              }
              PHPEOF
              sed -i 's/^              //' /tmp/drivetest.php
              php /tmp/drivetest.php 2>&1 | head -20; rm -f /tmp/drivetest.php
            fi
            if [ "${{ inputs.delete_dup_backups }}" = "true" ]; then
              B=storage/app/database_backups
              ls $B/1/backup_*.sql* >/dev/null 2>&1 || { echo "folder 1 has no backups - refusing to delete"; exit 1; }
              echo "== deleting duplicate backups (keeping folder 1)"
              for d in $B/*/; do n=$(basename $d)
                case "$n" in 1|*[!0-9]*) continue;; esac
                c=$(ls $d | grep -cE '^backup_[0-9]{8}_[0-9]{6}_[a-f0-9]{8}\.sql(\.gz)?$')
                find "$d" -maxdepth 1 -type f -regextype posix-extended -regex '.*/backup_[0-9]{8}_[0-9]{6}_[a-f0-9]{8}\.sql(\.gz)?' -delete
                rmdir "$d" 2>/dev/null && echo "  folder $n: deleted $c files, folder removed" || echo "  folder $n: deleted $c files, other files left: $(ls $d)"
              done
            fi
            php -l app/Services/DatabaseBackupService.php; php -l app/Console/Commands/DailyDatabaseBackup.php
            if [ "${{ inputs.run_backup }}" = "true" ]; then
              echo "== running db:backup-daily"; time php artisan db:backup-daily 2>&1 | tail -5
            fi
            echo "== verify: are other business folders copies of folder 1?"
            B=storage/app/database_backups
            for d in 1 3 12 20; do f=$(ls $B/$d/backup_20261118_*.sql 2>/dev/null | head -1); [ -z "$f" ] && continue
              echo "-- folder $d: $(basename $f) bytes=$(stat -c%s $f) tables=$(grep -c '^CREATE TABLE' $f) db=$(grep -m1 '^-- Host:' $f | tr -d '\r')"
              echo "   distinct business_id inserted into transactions: $(grep -m1 '^INSERT INTO `business` ' $f | grep -o '),(' | wc -l) extra business rows"
            done
            a=$(ls $B/1/backup_20261118_*.sql); b=$(ls $B/20/backup_20261118_*.sql)
            echo "-- line-level diff folder1 vs folder20 (same night): $(diff $a $b | grep -c '^[<>]') changed lines of $(wc -l < $a)"
            echo "== where is the rest? (ERP user view)"; du -xsh /www/playlist.nivessa.com 2>/dev/null; ls -ld /www /www/* 2>/dev/null
            df -h /
            echo "== backup dirs"; du -sh storage/app/database_backups/* 2>/dev/null | sort -V | head -25; ls -lh storage/app/database_backups/1 2>/dev/null
            echo "== storage/app depth 3"; du -xh --max-depth=3 storage/app 2>/dev/null | sort -rh | head -30
            echo "== storage/logs"; ls -lhS storage/logs | head -10
            for d in $(du -x --max-depth=2 storage/app 2>/dev/null | sort -rn | sed -n '2,4p' | cut -f2); do
              echo "== $d: file count $(find $d -type f | wc -l)"
              echo "-- by month (mtime)"; find $d -type f -printf '%TY-%Tm %s\n' | awk '{a[$1]+=$2;n[$1]++} END{for(k in a) printf "%s %.1fG %d files\n",k,a[k]/1073741824,n[k]}' | sort | tail -24
              echo "-- by extension"; find $d -type f -printf '%f %s\n' | awk '{n=split($1,x,"."); e=(n>1?x[n]:"none"); a[e]+=$2; c[e]++} END{for(k in a) printf "%.1fG %d .%s\n",a[k]/1073741824,c[k],k}' | sort -rn | head -8
              echo "-- sample newest"; ls -lt $d | head -6
              echo "-- sample oldest"; ls -ltr $d | head -4
            done
            cat > /tmp/diskdiag.php <<'PHPEOF'
            <?php
            require '/www/playlist.nivessa.com/app/vendor/autoload.php';
            $app = require '/www/playlist.nivessa.com/app/bootstrap/app.php';
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            use Illuminate\Support\Facades\DB;
            foreach (DB::select('SELECT table_schema s, ROUND(SUM(data_length+index_length+data_free)/1073741824,2) gb FROM information_schema.tables GROUP BY table_schema ORDER BY gb DESC') as $r) echo "DB {$r->s} {$r->gb}G\n";
            foreach (DB::select('SELECT table_schema s, table_name t, ROUND((data_length+index_length)/1073741824,2) gb, ROUND(data_free/1073741824,2) fr, table_rows r FROM information_schema.tables ORDER BY data_length+index_length+data_free DESC LIMIT 15') as $r) echo "TBL {$r->s}.{$r->t} {$r->gb}G free={$r->fr}G rows={$r->r}\n";
            try { $b = DB::select('SHOW BINARY LOGS'); $t=0; foreach ($b as $x) $t += $x->File_size; echo 'BINLOGS n='.count($b).' total='.round($t/1073741824,2)."G\n"; } catch (\Throwable $e) { echo 'BINLOGS err: '.substr($e->getMessage(),0,150)."\n"; }
            foreach (['log_bin','binlog_expire_logs_seconds','general_log','general_log_file','slow_query_log','datadir'] as $v) { try { $x = DB::select("SELECT @@$v v"); echo "VAR $v=".$x[0]->v."\n"; } catch (\Throwable $e) { echo "VAR $v n/a\n"; } }
            PHPEOF
            sed -i 's/^            //' /tmp/diskdiag.php
            echo "== mysql"; php /tmp/diskdiag.php 2>&1 | head -40; rm -f /tmp/diskdiag.php
