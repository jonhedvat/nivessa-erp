# One-off, read-only: how much of what the stores sell is NOT tied to a product
# that already existed in the ERP (manual register lines, products created at
# the moment of sale, backfilled "Unrecorded item" lines), by store, category,
# cashier and month; plus Clover card $ vs ERP card $. Tests the claim that
# ~30% of used in-store inventory isn't in the system. SELECTs + temp tables only.

name: Diag untracked used stock (read-only)

on:
  workflow_dispatch:
    inputs:
      days:
        description: Days back
        default: '180'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_untracked.php
            php -l /tmp/diag_untracked.php
            DAYS='${{ github.event.inputs.days }}' php /tmp/diag_untracked.php
            rm -f /tmp/diag_untracked.php
