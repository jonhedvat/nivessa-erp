name: Diag register close
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Close date YYYY-MM-DD (LA time; includes closes up to 6am next day)"
        required: true
      location:
        description: "Location name fragment (e.g. pico, hollywood); blank = all"
        required: false
        default: ""
concurrency:
  group: production-diag
  cancel-in-progress: false
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"
      - name: Add server to known_hosts (best-effort)
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3 4 5; do
            ssh-keyscan -T 10 -p "${{ steps.flags.outputs.ssh_port }}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            if grep -q . ~/.ssh/known_hosts 2>/dev/null; then exit 0; fi
            sleep 5
          done
          exit 0
      - name: Register closes for a date (read-only)
        uses: appleboy/ssh-action@v1.2.0
        env:
          D: ${{ inputs.date }}
          LOC: ${{ inputs.location }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          envs: D,LOC
          script_stop: false
          command_timeout: 60s
          script: |
            set +e
            cd /www/playlist.nivessa.com/app
            export D LOC
            php artisan tinker --no-ansi <<'PHP'
            $d = getenv('D'); $loc = trim((string) getenv('LOC'));
            $tz = config('app.timezone'); echo 'TZ app=' . $tz . "\n";
            $from = \Carbon\Carbon::parse($d . ' 00:00', 'America/Los_Angeles')->subDay();
            $to = $from->copy()->addDays(3);
            $q = \DB::table('cash_registers as cr')->leftJoin('users as u', 'u.id', '=', 'cr.user_id')->leftJoin('business_locations as bl', 'bl.id', '=', 'cr.location_id')->where(fn ($w) => $w->whereBetween('cr.created_at', [$from->copy()->setTimezone($tz)->toDateTimeString(), $to->copy()->setTimezone($tz)->toDateTimeString()])->orWhereBetween('cr.closed_at', [$from->copy()->setTimezone($tz)->toDateTimeString(), $to->copy()->setTimezone($tz)->toDateTimeString()]));
            if ($loc !== '') $q->where('bl.name', 'like', '%' . $loc . '%');
            $rows = $q->orderBy('cr.id')->get(['cr.*', 'u.first_name', 'u.last_name', 'bl.name as loc']);
            echo 'COUNT=' . count($rows) . "\n";
            foreach (\DB::table('cash_registers')->where('status', 'open')->get(['id', 'user_id', 'location_id', 'created_at']) as $o) { echo 'OPEN ' . json_encode($o) . ' expected_cash=' . \DB::table('cash_register_transactions')->where('cash_register_id', $o->id)->where('pay_method', 'cash')->selectRaw("COALESCE(SUM(CASE WHEN type = 'debit' THEN -amount ELSE amount END), 0) AS net")->value('net') . "\n"; }
            try { echo 'VIEW ' . (view()->exists('cash_register.close_register_modal') ? 'exists' : 'missing') . ' has_countoff=' . (strpos(file_get_contents(resource_path('views/cash_register/close_register_modal.blade.php')), 'cr-count-off') !== false ? 'yes' : 'no') . "\n"; } catch (\Throwable $e) { echo 'VIEWERR ' . $e->getMessage() . "\n"; }
            foreach ($rows as $r) {
              echo 'REG ' . json_encode($r) . "\n";
              $tx = \DB::table('cash_register_transactions')->where('cash_register_id', $r->id)->selectRaw('pay_method, type, transaction_type, ROUND(SUM(amount),2) amt, COUNT(*) n')->groupBy('pay_method', 'type', 'transaction_type')->get();
              echo 'TX ' . json_encode($tx) . "\n";
            }
            PHP
