name: Diag contact store-credit history

# Read-only: every store-credit movement for one contact id — balance_notes,
# store_credit_logs, and all their transactions with payment lines (advance =
# store credit spent). Used to explain negative / surprising balances.

on:
  workflow_dispatch:
    inputs:
      contact_id:
        description: Contact id (from diag-customer-credit-lookup)
        required: true

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run on prod
        uses: appleboy/ssh-action@v1.2.0
        env:
          CONTACT_ID: ${{ inputs.contact_id }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: CONTACT_ID
          command_timeout: 5m
          script: |
            echo '' | base64 -d > /tmp/contact_credit_hist.php
            cd /www/playlist.nivessa.com/app && CONTACT_ID="$CONTACT_ID" php artisan tinker /tmp/contact_credit_hist.php 2>&1
            rm -f /tmp/contact_credit_hist.php
