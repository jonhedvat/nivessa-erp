# One-off, read-only: per category > subcategory (and per store), 90-day
# conversion by list-price bucket for items added 90-450 days ago, plus the
# "price floor" where going cheaper stops selling better. SELECTs + temp tables only.

name: Diag price floor by category (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_price_floor.php
            php -l /tmp/diag_price_floor.php
            php /tmp/diag_price_floor.php
            rm -f /tmp/diag_price_floor.php
