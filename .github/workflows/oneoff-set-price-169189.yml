# One-off WRITE (2026-11-18): product 169189 price $20 -> $8, only if still $20.
# conversion by list-price bucket for items added 90-450 days ago, plus the
# "price floor" where going cheaper stops selling better. SELECTs + temp tables only.

name: One-off: set Peter Gabriel CD 169189 to $8

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/set_price.php
            php -l /tmp/set_price.php
            php /tmp/set_price.php
            rm -f /tmp/set_price.php
