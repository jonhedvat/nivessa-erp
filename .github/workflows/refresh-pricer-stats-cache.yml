# Clears the Mass Add AI pricer's cached per-category sales stats (rebuilt on next use).
# Use after merging or renaming categories.

name: Refresh Mass Add pricer stats cache

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/forget_stats.php
            php /tmp/forget_stats.php
            rm -f /tmp/forget_stats.php
