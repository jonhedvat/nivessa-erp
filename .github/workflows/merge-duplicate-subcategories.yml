# 11/19 step 2: renames Cassettes - Used > 'Soul' (#295, now holding the merged R&b) to
# 'R&B, Soul & Funk' to match the vinyl name. (Step 1 merge already ran; undo log
# storage/app/subcategory-merge-undo-20261119-095741.json.) DRY RUN by default.

name: Merge / rename subcategories (11/19)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually move? (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        with:
          envs: COMMIT
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/subcat_merge.php
            if [ "$COMMIT" = "true" ]; then php /tmp/subcat_merge.php --commit; else php /tmp/subcat_merge.php; fi
            rm -f /tmp/subcat_merge.php
