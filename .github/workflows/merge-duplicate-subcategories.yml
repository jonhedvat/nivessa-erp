# 11/19 step 6: renames Gift Items > 'Tech Accessories (phone cases, slipmats, dust covers)'
# to 'Tech Accessories (chargers, cables, phone cases, slipmats)' and deactivates the
# duplicate USB-C adapter listing #153147 ($0.38, no stock). DRY RUN by default. Undo log: storage/app/subcategory-merge-undo-*.json.

name: Merge / rename subcategories (11/19)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Actually move? (leave unchecked for a dry run)'
        type: boolean
        default: false

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMIT: ${{ github.event.inputs.commit }}
        with:
          envs: COMMIT
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/subcat_merge.php
            if [ "$COMMIT" = "true" ]; then php /tmp/subcat_merge.php --commit; else php /tmp/subcat_merge.php; fi
            rm -f /tmp/subcat_merge.php
