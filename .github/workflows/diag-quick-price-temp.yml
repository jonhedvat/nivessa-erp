# Read-only: runs a fixed list of sports cards through the Mass Add AI pricer
# on prod and prints the prices it gives. No writes.

name: Diag quick price test (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_qp.php
            for f in app/Http/Controllers/MassAddAiPriceController.php app/Services/EbayService.php app/Services/DiscogsService.php app/Http/Controllers/ProductController.php; do php -l $f; done; php /tmp/diag_qp.php
            rm -f /tmp/diag_qp.php
