# One-off, read-only: which ERP login marked Discogs orders shipped with
# tracking "1" on 11/16 (name pHqghUme). SELECTs + log greps only.
name: Diag who shipped Discogs 11-16 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 10m
          script: |
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_who.php
            php /tmp/diag_who.php
            rm -f /tmp/diag_who.php
            echo "### access log hits on discogs ship"
            for f in /www/wwwlogs/playlist.nivessa.com.log /www/wwwlogs/playlist.nivessa.com*.log /var/log/nginx/access.log; do [ -r "$f" ] && grep -h "discogs/.*/ship" "$f" | tail -20; done
            echo "### top user agents 16/Nov 10:00-12:00 UTC"
            for f in /www/wwwlogs/playlist.nivessa.com.log /var/log/nginx/access.log; do [ -r "$f" ] && grep -h "16/Nov/2026:1[01]:" "$f" | awk -F'"' '{print $1" "$6}' | awk '{print $1, substr($0, index($0,$NF))}' | cut -c1-200 | sort | uniq -c | sort -rn | head -10; done
            echo "### scanner strings in laravel log"
            grep -c "pHqghUme" storage/logs/*.log 2>/dev/null | grep -v ":0" | head
