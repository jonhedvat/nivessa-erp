# One-off, read-only: which ERP login marked Discogs orders shipped with
# tracking "1" on 11/16 (name pHqghUme). SELECTs + log greps only.
name: Diag who shipped Discogs 11-16 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 10m
          script: |
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_who.php
            php /tmp/diag_who.php
            rm -f /tmp/diag_who.php
            echo "### access_log config"
            F=$(sudo -n true 2>/dev/null && echo sudo -n)
            $F grep -rhoE "access_log\s+[^ ;]+" /etc/nginx /www/server/nginx/conf /www/server/panel/vhost 2>/dev/null | sort -u | head
            ls -la /www/wwwlogs 2>&1 | head -15
            L=$($F grep -rhoE "access_log\s+[^ ;]+" /etc/nginx /www/server/nginx/conf /www/server/panel/vhost 2>/dev/null | awk '{print $2}' | grep -i playlist | sort -u)
            echo "### using: $L"
            for f in $L $L.1; do [ -r "$f" ] || continue; echo "--- ship posts in $f"; $F grep -ah "discogs/8037290-1.*/ship" $f | cut -c1-350 | head -12; echo "--- top IP|UA 16/Nov 10:40-11:40 UTC"; $F grep -ahE "16/Nov/2026:1[01]:" $f | awk -F'"' '{split($1,a," "); print a[1]" | "$6}' | sort | uniq -c | sort -rn | head -8; echo "--- top IP|UA 15/Nov 18:25-18:45 UTC"; $F grep -ahE "15/Nov/2026:18:[234]" $f | awk -F'"' '{split($1,a," "); print a[1]" | "$6}' | sort | uniq -c | sort -rn | head -8; done
            echo "### log files mentioning the ship request"
            F=$(sudo -n true 2>/dev/null && echo sudo -n); for d in /www/wwwlogs /var/log/nginx /var/log/apache2 /var/log/httpd /www/server/nginx/logs /usr/local/nginx/logs; do $F grep -rlas "discogs/8037290-17486/ship" $d 2>/dev/null; done | sort -u | tee /tmp/wholog
            echo "### requests to discogs ship (ip, time, ua)"
            for f in $(cat /tmp/wholog); do $F zgrep -ah "discogs/8037290-1[67][0-9]*/ship" $f | cut -c1-400; done | head -20
            echo "### all IPs + UAs that hit the ERP 15-16 Nov with pHqghUme or scanner-ish UAs"
            for f in $(cat /tmp/wholog); do $F zgrep -ahE "1[56]/Nov/2026" $f | grep -iE "phqghume|acunetix|burp|zap|nikto|sqlmap|nessus|headless|playwright|puppeteer|python|curl|go-http|claude|anthropic|openai|gpt|browser-use" | awk -F'"' '{split($1,a," "); print a[1]" | "$6}' | sort | uniq -c | sort -rn | head -15; done
            echo "### IPs active 10:40-11:35 UTC 16 Nov (2:40-3:35 AM PT)"
            for f in $(cat /tmp/wholog); do $F zgrep -ahE "16/Nov/2026:1[01]:[0-5]" $f | awk -F'"' '{split($1,a," "); print a[1]" | "$6}' | sort | uniq -c | sort -rn | head -10; done
            rm -f /tmp/wholog
