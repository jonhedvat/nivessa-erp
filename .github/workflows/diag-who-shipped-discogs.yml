# One-off, read-only: which ERP login marked Discogs orders shipped with
# tracking "1" on 11/16 (name pHqghUme). SELECTs + log greps only.
name: Diag who shipped Discogs 11-16 (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          command_timeout: 10m
          script: |
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_who.php
            php /tmp/diag_who.php
            rm -f /tmp/diag_who.php
