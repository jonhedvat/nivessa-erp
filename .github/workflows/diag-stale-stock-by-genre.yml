# One-off, read-only: on-hand stock at a store by category > subcategory, with
# how much has sat 6+ months / 1+ year with no local sale, years of supply vs
# last-12-month sales, and stale retail $. SELECTs + temp tables only.

name: Diag stale stock by genre (read-only)

on:
  workflow_dispatch:
    inputs:
      location:
        description: Location id (1 = Pico, 2 = Hollywood)
        default: '2'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve SSH port
        id: flags
        env:
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: echo "ssh_port=${DEPLOY_PORT:-22}" >> "$GITHUB_OUTPUT"

      - name: Run diag
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ steps.flags.outputs.ssh_port }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            cd /www/playlist.nivessa.com/app
            echo '' | base64 -d > /tmp/diag_stale.php
            php -l /tmp/diag_stale.php
            LOC='${{ github.event.inputs.location }}' php /tmp/diag_stale.php
            rm -f /tmp/diag_stale.php
